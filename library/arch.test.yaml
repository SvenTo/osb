# Tests for arch.yaml. Run: osb test vm/library [--run]
tests:
  - name: removes repositories and sets mirrors
    flavor: archlinux
    steps:
      - action: write-file
        args:
          path: /etc/pacman.conf
          append: true
          content: |

            [gce]
            Server = https://example.com/gce

      - action: remove-pacman-repositories
        args: { names: [community, gce] }
      - action: set-pacman-mirrors
      - action: update-pacman-keyring
      - action: install-local-packages
        args: { dir: /nonexistent }
      - action: assert
        args:
          message: pacman configuration not as expected
          command: >-
            ! grep -q '^\[gce\]' /etc/pacman.conf && grep -q '^\[core\]' /etc/pacman.conf &&
            grep -qx 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' /etc/pacman.d/mirrorlist
    expect:
      contains:
        - "sed -i -e '/^\\[community\\]/,/^$/d' -e '/^\\[gce\\]/,/^$/d' /etc/pacman.conf"
        - awk -v min=2025
        - no package files in /nonexistent
    run: true

  - name: installs optional dependencies with --asdeps
    flavor: archlinux
    steps:
      - action: install-packages-as-deps
        args: { packages: [pigz, zip] }
      - action: install-nvidia-driver
    expect:
      contains:
        - pacman -S --needed --noconfirm --asdeps pigz zip
        - grep -qs 0x10de /sys/bus/pci/devices/*/vendor

  - name: is Arch only
    flavor: debian
    steps:
      - action: set-pacman-mirrors
    expect:
      error: does not support flavor debian

  - name: builds a pinned AUR package with repository dependencies
    flavor: archlinux
    steps:
      # downgrade 12.0.3 (not the latest release) needs pacman-contrib and fzf
      - action: install-aur-package
        args: { name: downgrade, commit: 683636e352fa0042380e24f54fc40f6a0ae8270a }
      # installed again: skipped
      - action: install-aur-package
        args: { name: downgrade, commit: 683636e352fa0042380e24f54fc40f6a0ae8270a }
      # VCS package: sources without checksums are refused
      - action: install-aur-package
        on-error: continue
        args: { name: yay-git, commit: c4fd6ef8d614939a7ebf685a37702415866e9d92 }
      - action: assert
        args:
          message: AUR packages not as expected
          command: >-
            pacman -Q downgrade | grep -qx 'downgrade 12.0.3-1' &&
            [ "$(pacman -Qi fzf | sed -n 's/^Install Reason *: //p')" = 'Installed as a dependency for another package' ] &&
            ! pacman -Q yay-git >/dev/null 2>&1 && [ ! -e /var/cache/osb/aur-build/downgrade ]
    expect:
      contains: [makepkg --noconfirm --cleanbuild --nocheck]
    run: true

  - name: requires a full commit hash
    flavor: archlinux
    steps:
      - action: install-aur-package
        args: { name: downgrade, commit: 683636e }
    expect:
      error: does not match pattern

  - name: requires full key fingerprints
    flavor: archlinux
    steps:
      - action: install-aur-package
        args: { name: downgrade, commit: 683636e352fa0042380e24f54fc40f6a0ae8270a, pgp-keys: [ABCD1234] }
    expect:
      error: full 40 character fingerprints
