name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build binaries and the VS Code extension
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          (cd editors/vscode && npm version --no-git-tag-version --allow-same-version "${version%%-*}")
          make vscode VERSION="${GITHUB_REF_NAME}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "osb $GITHUB_REF_NAME" --generate-notes $prerelease
